<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2cbf"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGradient)"/>
  
  <!-- Central brain/AI shape -->
  <g transform="translate(256, 256)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#accentGradient)" stroke-width="12" opacity="0.3"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#accentGradient)" stroke-width="8" opacity="0.6"/>
    
    <!-- Brain/Network nodes -->
    <circle cx="0" cy="-50" r="16" fill="#00d4ff"/>
    <circle cx="43" cy="-25" r="14" fill="#00d4ff" opacity="0.9"/>
    <circle cx="43" cy="25" r="14" fill="#7b2cbf" opacity="0.9"/>
    <circle cx="0" cy="50" r="16" fill="#7b2cbf"/>
    <circle cx="-43" cy="25" r="14" fill="#7b2cbf" opacity="0.9"/>
    <circle cx="-43" cy="-25" r="14" fill="#00d4ff" opacity="0.9"/>
    
    <!-- Connecting lines -->
    <path d="M 0,-50 L 43,-25 L 43,25 L 0,50 L -43,25 L -43,-25 Z" 
          fill="none" stroke="url(#accentGradient)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Center hub -->
    <circle cx="0" cy="0" r="20" fill="url(#accentGradient)"/>
    
    <!-- Stats bars -->
    <rect x="-6" y="-100" width="12" height="40" rx="3" fill="#00d4ff" opacity="0.8"/>
    <rect x="-6" y="60" width="12" height="40" rx="3" fill="#7b2cbf" opacity="0.8"/>
    <rect x="-100" y="-6" width="40" height="12" rx="3" fill="#00d4ff" opacity="0.8"/>
    <rect x="60" y="-6" width="40" height="12" rx="3" fill="#7b2cbf" opacity="0.8"/>
  </g>
</svg>
